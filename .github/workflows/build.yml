name: Build MODcpoy Tweak

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build for arm64e (iOS 18.x)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          # Install Theos
          git clone --depth 1 https://github.com/theos/theos.git /opt/theos
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          
          # Install iOS 18 SDK
          xcodebuild -version
          xcrun --show-sdk-version
          
          # Verify Theos installation
          $THEOS/bin/nic.pl --version

      - name: Install dependencies
        run: |
          # Install required tools
          brew install ldid dpkg
          
          # Verify dpkg-deb for packaging
          dpkg-deb --version

      - name: Build tweak
        env:
          THEOS: /opt/theos
          THEOS_DEVICE_ARCH: arm64e
          TARGET: ios:18.0
          ROOTLESS: 1
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          export THEOS_DEVICE_ARCH=arm64e
          export TARGET=ios:18.0
          export ROOTLESS=1
          
          make clean
          make package FINALPACKAGE=1

      - name: Verify build output
        run: |
          ls -la .theos/obj/debug/arm64e/
          ls -la packages/
          
          # Check dylib exists
          if [ -f .theos/obj/debug/arm64e/MODcpoy.dylib ]; then
            echo "✓ Dylib built successfully"
            file .theos/obj/debug/arm64e/MODcpoy.dylib
          else
            echo "✗ Dylib not found"
            exit 1
          fi
          
          # Check deb package
          if [ -f packages/com.mody.modcpoy_1.0.0_arm64e.deb ]; then
            echo "✓ .deb package created"
            dpkg-deb -I packages/com.mody.modcpoy_1.0.0_arm64e.deb
          else
            echo "✗ .deb package not found"
            ls -la packages/
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MODcpoy-arm64e
          path: |
            .theos/obj/debug/arm64e/MODcpoy.dylib
            packages/com.mody.modcpoy_1.0.0_arm64e.deb
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .theos/obj/debug/arm64e/MODcpoy.dylib
            packages/com.mody.modcpoy_1.0.0_arm64e.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: |
            .theos/obj/debug/arm64e/MODcpoy.dylib
            packages/com.mody.modcpoy_1.0.0_arm64e.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}