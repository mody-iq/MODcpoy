name: Build MODcpoy Tweak

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build for arm64e (iOS 18.x)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Show Xcode info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | head -20

      - name: Install Theos
        run: |
          # Clone Theos
          git clone --depth 1 https://github.com/theos/theos.git /opt/theos
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          
          # Make scripts executable
          chmod +x $THEOS/bin/theos/bin/nic.pl 2>/dev/null || true
          chmod +x $THEOS/bin/nic.pl 2>/dev/null || true
          
          # Verify
          ls -la $THEOS/bin/
          $THEOS/bin/nic.pl --help 2>&1 | head -5 || echo "nic.pl not found, checking structure"

      - name: Install dependencies
        run: |
          brew update
          brew install ldid dpkg
          dpkg-deb --version
          ldid --version

      - name: Build tweak
        env:
          THEOS: /opt/theos
          THEOS_DEVICE_ARCH: arm64e
          TARGET: iphone:clang:15.0:15.0
          ROOTLESS: 1
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          export THEOS_DEVICE_ARCH=arm64e
          export TARGET=iphone:clang:15.0:15.0
          export ROOTLESS=1
          
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 V=1

      - name: Verify build output
        run: |
          echo "=== Theos obj directory ==="
          find .theos -name "*.dylib" 2>/dev/null || echo "No dylib found in .theos"
          ls -la .theos/ 2>/dev/null || echo "No .theos directory"
          
          echo "=== Packages directory ==="
          ls -la packages/ 2>/dev/null || echo "No packages directory"
          
          echo "=== All build artifacts ==="
          find . -name "*.deb" -o -name "*.dylib" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MODcpoy-build-artifacts
          path: |
            packages/*.deb
            **/*.dylib
          retention-days: 30
        continue-on-error: true

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            **/*.dylib
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.version != '' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: |
            packages/*.deb
            **/*.dylib
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}